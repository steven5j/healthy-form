name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - master
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼 (Checkout code)
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境 (Setup Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 安裝相依套件 (Install dependencies)
        run: npm ci

      - name: 專案構建編譯 (Build project)
        run: npm run build

      - name: 部署至 Firebase Hosting (使用 Token 方式)
        if: ${{ env.FIREBASE_TOKEN != '' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx firebase-tools deploy --only hosting --token "$FIREBASE_TOKEN"

      - name: 部署至 Firebase Hosting (使用 Service Account 方式)
        if: ${{ env.FIREBASE_TOKEN == '' && env.FIREBASE_SERVICE_ACCOUNT != '' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ytfannie-cute
